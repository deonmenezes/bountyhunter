[package]
name = "mantishack_core_sarif"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# SARIF result/rule transforms — Rust port of the pure functions in
# core/sarif/parser.py (CWE extraction, dedup keys, tool/rule accessors,
# display sanitisation). File I/O + the escape_nonprintable-dependent dataflow
# extraction stay call-site in Python for now.

[lib]
name = "mantishack_core_sarif"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { workspace = true, optional = true }
regex = { workspace = true }
# preserve_order so get_rules / sanitised findings iterate in file order,
# matching Python dict/json.loads ordering.
serde_json = { version = "1", features = ["preserve_order"] }
