[package]
name = "mantishack_sca"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# SCA dependency model + manifest parsers — Rust port of packages/sca/models.py
# (the Dependency/PinStyle/Confidence core) and packages/sca/parsers/*. The
# parsers are pure text/format transforms; file reading stays at the call site,
# so each parser takes already-read content.

[lib]
name = "mantishack_sca"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { workspace = true, optional = true }
# preserve_order so parsed JSON objects iterate in file order, matching Python
# json.loads (the manifest parsers emit deps in declaration order).
serde_json = { version = "1", features = ["preserve_order"] }
regex = { workspace = true }
# TOML lockfiles/manifests (poetry.lock, uv.lock, Cargo.toml, pyproject, Pipfile)
# parsed via the toml crate then converted to serde_json::Value for traversal.
# preserve_order so tables iterate in file order (matching Python tomllib).
toml = { version = "0.8", features = ["preserve_order"] }
# YAML manifests/lockfiles (Yarn Berry, pnpm, compose, helm, k8s, gitlab-ci).
serde_yaml = "0.9"
