[package]
name = "mantishack_core_witness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mantishack_core_witness"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { workspace = true, optional = true }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
