[package]
name = "mantishack_nvd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# NVD payload parsing — Rust port of packages/nvd/parser.py. The HTTP client
# (packages.nvd.client) + the verify oracle's I/O stay in Python; this crate is
# the pure Patch-tagged reference extractor.

[lib]
name = "mantishack_nvd"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { workspace = true, optional = true }
serde_json = "1"
mantishack_core_url_patterns = { path = "../mantishack_core_url_patterns" }
