[package]
name = "mantishack_engine_semgrep_tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Semgrep SARIF CLI glue — Rust port of `engine/semgrep/tools/sarif_merge.py`.
# The module's public symbol is `merge_sarif_files(output, inputs)`: load each
# input SARIF, group runs by tool, dedup results, union rules/uri-bases/
# invocations, then write the merged SARIF. The merge algorithm + safety-guarded
# loader live here (they are kept in Python in `core.sarif` by design); the
# per-result dedup key is reused from `mantishack_core_sarif::result_key` and the
# atomic JSON writer from `mantishack_core_json::save_json`.

[lib]
name = "mantishack_engine_semgrep_tools"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { workspace = true, optional = true }
# preserve_order so merged runs/results/rules and object keys serialise in
# insertion order, matching Python dict / json.dumps ordering. Also unifies
# serde_json across the graph so `save_json` writes ordered output.
serde_json = { version = "1", features = ["preserve_order"] }
mantishack_core_sarif = { path = "../mantishack_core_sarif" }
mantishack_core_json = { path = "../mantishack_core_json" }

[dev-dependencies]
tempfile = "3"
