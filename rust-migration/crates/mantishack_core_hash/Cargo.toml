[package]
name = "mantishack_core_hash"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mantishack_core_hash"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
libc = "0.2"
mantishack_core_config = { path = "../mantishack_core_config" }
pyo3 = { workspace = true, optional = true }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
