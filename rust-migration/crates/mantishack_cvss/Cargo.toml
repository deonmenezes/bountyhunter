[package]
name = "mantishack_cvss"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mantishack_cvss"
# rlib for in-Rust reuse + parity tests; cdylib for the Python extension module.
crate-type = ["cdylib", "rlib"]

[features]
# `cargo test` runs the parity oracle with no Python linkage.
# `maturin develop --features python` builds the importable extension.
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { workspace = true, optional = true }
