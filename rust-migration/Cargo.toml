[workspace]
resolver = "2"
# Glob membership: every crate under crates/ is a member automatically. This lets
# parallel port tasks add a new crate without editing this file (which would make
# their commits collide on the shared members list). Verified equivalent to the
# prior explicit 38-member list at conversion time.
members = ["crates/*"]

# Shared profile: optimise the static-analysis hot paths that motivated the
# migration (call graph / reachability). Faithful ports first; perf is free.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.74"

# PyO3 is shared across every ported crate so Python keeps orchestrating while
# the compute moves to Rust. Gated behind each crate's `python` feature so plain
# `cargo test` (parity oracle) builds without linking libpython.
[workspace.dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
regex = "1"
url = "2"
